name: Crib Occupancy Detector
version: "0.1.0"
slug: crib_detector
description: Tells Home Assistant whether a child is in the crib, from camera snapshots and a locally run image classifier. Images never leave memory.
url: "https://github.com/talcum/ha-claude-code-addon"
arch:
  - aarch64
  - amd64

# s6-overlay v3 must be PID 1
init: false

startup: services
boot: auto
stage: experimental

# Snapshots come from Home Assistant's camera proxy, with the add-on's
# Supervisor token; no camera or Protect credentials needed.
homeassistant_api: true
services:
  - mqtt:need

host_network: false
apparmor: false
backup: hot

options:
  model_url: ""
  cameras: []
  interval: 5
  on_minutes: 5
  off_minutes: 2
  model_check_interval: 3600
  discovery_prefix: homeassistant
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  log_level: info

schema:
  model_url: str?
  cameras:
    - entity_id: str
      id: match(^[a-z0-9_]+$)
      name: str
      area: str?
  interval: int(2,300)
  on_minutes: float(0.5,120)
  off_minutes: float(0.5,120)
  model_check_interval: int(60,86400)
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)?
